<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MacDitto{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">MacDitto</h1>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="#" onclick="showProfiles()">Profiles</a>
                <a href="#" onclick="runScan()">Scan</a>
                <a href="#" onclick="saveProfile()">Save</a>
                <a href="#" onclick="exportProfile()">Export</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Notification toast -->
    <div id="toast" class="toast"></div>

    <!-- Profile modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeProfileModal()">&times;</span>
            <h2>Saved Profiles</h2>
            <div id="profileList"></div>
        </div>
    </div>

    <!-- Save profile modal -->
    <div id="saveModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSaveModal()">&times;</span>
            <h2>Save Profile</h2>
            <input type="text" id="profileName" placeholder="Profile name (optional)">
            <button onclick="confirmSave()">Save</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
